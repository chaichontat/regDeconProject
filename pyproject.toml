[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "registration-fusion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aicspylibczi>=3.3",
  "click>=8.1",
  "cupy-cuda12x>=13",
  "numpy>=1.26",
  "pillow>=10",
  "scikit-image>=0.24",
  "scipy>=1.13",
  "SimpleITK>=2.5",
  "tifffile>=2024",
  "zarr>=3.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
registration-fusion = "registration_fusion.cli:main"

[tool.setuptools.packages.find]
include = ["registration_fusion*"]
